<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Waiting should keep your place.</title>
<desc id="desc">Presentation-only design sketch. All trend colours, traces, results and dates of change are illustrative, not NASA observations. Coastline: Natural Earth.</desc>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 7L7 0M5 9L9 5" stroke="#F3F1E7" stroke-width="1" opacity=".52"/></pattern></defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#101E28" stroke="none" opacity="1"/>
<rect x="0" y="0" width="1440" height="32" rx="0" fill="#F3F1E7" stroke="none" opacity="1"/>
<text x="40" y="22" fill="#101E28" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.3">DESIGN STUDY / ILLUSTRATIVE DATA / NOT A LIVE ANALYSIS</text>
<text x="1400" y="22" fill="#101E28" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="0">B / SIGNAL DESK</text>
<text x="40" y="73" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">EARTH SYSTEM / TRENDS</text>
<text x="930" y="73" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0">Explore</text>
<line x1="930" y1="86" x2="982.5" y2="86" stroke="#E8AF78" stroke-width="3" stroke-dasharray=""/>
<text x="1060" y="73" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Time series</text>
<text x="1220" y="73" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Change points</text>
<line x1="40" y1="102" x2="1400" y2="102" stroke="#3C535F" stroke-width="1" stroke-dasharray=""/>
<text x="40" y="145" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">REFINEMENT 04 / SIGNAL DESK / PROPOSAL FOR TEAM REVIEW</text>
<text x="1400" y="145" fill="#AFBFC6" font-family="Consolas, monospace" font-size="13" font-weight="400" text-anchor="end" letter-spacing="0">+0.75–1.25 H</text>
<text x="40" y="211" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="45" font-weight="700" text-anchor="start" letter-spacing="-1">Waiting should keep your place.</text>
<text x="40" y="253" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">A quiet request rail communicates real state, not imaginary measurements or a fake countdown.</text>
<line x1="40" y1="287" x2="1400" y2="287" stroke="#3C535F" stroke-width="1" stroke-dasharray=""/>
<text x="40" y="326" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">STATE 1 / CONNECTING</text>
<line x1="40" y1="345" x2="452" y2="345" stroke="#3C535F" stroke-width="1" stroke-dasharray=""/>
<text x="40" y="393" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">AREA / 25–35° E / 44–52° N</text>
<text x="40" y="432" fill="#F3F1E7" font-family="Consolas, monospace" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">2000 — 2025</text>
<line x1="40" y1="492" x2="452" y2="492" stroke="#3C535F" stroke-width="2" stroke-dasharray=""/>
<line x1="108" y1="480" x2="108" y2="504" stroke="#E8AF78" stroke-width="3" stroke-dasharray=""/>
<line x1="128" y1="480" x2="128" y2="504" stroke="#E8AF78" stroke-width="3" stroke-dasharray=""/>
<text x="40" y="559" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Connecting to the</text>
<text x="40" y="593" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">analysis service…</text>
<text x="40" y="651" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">Your selection stays here.</text>
<text x="40" y="678" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">No observations returned yet.</text>
<text x="512" y="326" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">STATE 2 / WAITING FOR SOURCE</text>
<line x1="512" y1="345" x2="924" y2="345" stroke="#3C535F" stroke-width="1" stroke-dasharray=""/>
<text x="512" y="393" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">AREA / 25–35° E / 44–52° N</text>
<text x="512" y="432" fill="#F3F1E7" font-family="Consolas, monospace" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">2000 — 2025</text>
<line x1="512" y1="492" x2="924" y2="492" stroke="#3C535F" stroke-width="2" stroke-dasharray=""/>
<line x1="718" y1="480" x2="718" y2="504" stroke="#E8AF78" stroke-width="3" stroke-dasharray=""/>
<line x1="738" y1="480" x2="738" y2="504" stroke="#E8AF78" stroke-width="3" stroke-dasharray=""/>
<text x="512" y="559" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Waiting for</text>
<text x="512" y="593" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">observations…</text>
<text x="512" y="651" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Elapsed 01:12 · illustrative timer</text>
<text x="512" y="678" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Progress is not reported by the source.</text>
<text x="984" y="326" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">STATE 3 / SOURCE UNAVAILABLE</text>
<line x1="984" y1="345" x2="1396" y2="345" stroke="#3C535F" stroke-width="1" stroke-dasharray=""/>
<text x="984" y="393" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">AREA / 25–35° E / 44–52° N</text>
<text x="984" y="432" fill="#F3F1E7" font-family="Consolas, monospace" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">2000 — 2025</text>
<line x1="984" y1="492" x2="1396" y2="492" stroke="#3C535F" stroke-width="2" stroke-dasharray=""/>
<line x1="1176" y1="483" x2="1194" y2="501" stroke="#E8AF78" stroke-width="2" stroke-dasharray=""/>
<line x1="1194" y1="483" x2="1176" y2="501" stroke="#E8AF78" stroke-width="2" stroke-dasharray=""/>
<text x="984" y="559" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">The source could not</text>
<text x="984" y="593" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">complete this request.</text>
<rect x="984" y="636" width="166" height="44" rx="0" fill="#101E28" stroke="#F3F1E7" opacity="1"/>
<text x="1067.0" y="663.0" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">Retry request</text>
<text x="984" y="713" fill="#AFBFC6" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">No observations have been substituted.</text>
<text x="40" y="796" fill="#F3F1E7" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">These are alternative states, not an automatic sequence. The rail never draws a pretend chart.</text>
<line x1="40" y1="842" x2="1400" y2="842" stroke="#3C535F" stroke-width="1" stroke-dasharray=""/>
<text x="40" y="871" fill="#AFBFC6" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">Motion is optional: an indeterminate bracket moves; reduced motion keeps it still · real stages come from the API.</text>
<text x="1400" y="871" fill="#AFBFC6" font-family="Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="0">EN / NASA SPACE APPS 2026</text>
</svg>