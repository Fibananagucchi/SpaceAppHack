> name: Deploy SpaceAppHack to Azure
> 
> on:
>   push:
>     branches: [main]        # твоя гілка
>   workflow_dispatch:        # ручний запуск з вкладки Actions
> 
> jobs:
>   build:
>     runs-on: ubuntu-latest
>     steps:
>       - uses: actions/checkout@v4
> 
>       - uses: actions/setup-node@v4
>         with:
>           node-version: '22'
>           cache: npm
>           cache-dependency-path: frontend/package-lock.json
> 
>       - name: Build frontend
>         working-directory: frontend
>         run: |
>           npm ci
>           npm run build
> 
>       - name: Assemble package
>         run: |
>           mkdir -p package/frontend
>           cp -r backend package/backend
>           cp -r frontend/dist package/frontend/dist
>           echo "-r backend/requirements.txt" > package/requirements.txt
>           find package -name "__pycache__" -type d -prune -exec rm -rf {} +
> 
>       - uses: actions/upload-artifact@v4
>         with:
>           name: app
>           path: package
> 
>   deploy:
>     runs-on: ubuntu-latest
>     needs: build
>     permissions:
>       id-token: write
>       contents: read
>     steps:
>       - uses: actions/download-artifact@v4
>         with:
>           name: app
>           path: app
> 
>       - uses: azure/login@v2
>         with:
>           client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_XXXX }}            # ← з файлу Azure
>           tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_XXXX }}            # ← з файлу Azure
>           subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_XXXX }} # ← з файлу Azure
> 
>       - uses: azure/webapps-deploy@v3
>         with:
>           app-name: SpaceAppHack
>           slot-name: Production
>           package: app
